spring.application.name=FootballManager

server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:postgresql://localhost:5432/test_springBoot
spring.datasource.username=myuser
spring.datasource.password=mypassword

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.com.example.footballmanager=trace
logging.level.org.springframework.web=debug

end.point.managers=/managers

end.point.create=/create
end.point.id=/{id}